services:
  collector:
    build:
      context: .
      dockerfile: packages/collector/Dockerfile
    ports:
      - "8080:8080" # WebSocket (agents + frontend)
      - "8081:8081" # HTTP API
    volumes:
      # Bind mount (not a named volume) to a host path, so the DB survives
      # image rebuilds/updates as long as DATA_DIR keeps pointing here --
      # `docker compose down -v` doesn't touch it either. DB_PATH inside the
      # container defaults to ./data/collector.db, matching this mount.
      - ${DATA_DIR:-./data}:/app/data
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_HTTP_BASE_URL: ${VITE_HTTP_BASE_URL:-http://localhost:8081}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080}
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - collector
